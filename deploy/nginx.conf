# CourtBazaar — Nginx config for a Hostinger VPS.
# Copy to /etc/nginx/sites-available/courtbazaar, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Adjust: server_name, the frontend build path, and add TLS (certbot) before
# going live — this file intentionally ships HTTP-only as a starting point.

server {
    listen 80;
    server_name courtbazaar.in www.courtbazaar.in;

    # --- Frontend: React production build ---
    root /var/www/courtbazaar/frontend/build;
    index index.html;

    # Long cache for hashed static assets; never cache index.html itself so
    # deploys are picked up immediately.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter fallback — without this, refreshing or directly loading
    # any non-root route (e.g. /pricing) 404s. This was a confirmed gap in
    # the pre-launch audit.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Backend: FastAPI/Uvicorn behind this reverse proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match the backend's own upload cap (MAX_UPLOAD_SIZE_BYTES) so Nginx
        # doesn't reject large document uploads before the app even sees them.
        client_max_body_size 12m;
    }
}
